name: Frontend build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: node --test tests/staging.test.mjs
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node --import tsx --test tests/platform*.test.mjs tests/job-customer.test.mjs
        env:
          TEST_DATABASE_URL: postgres://platform_test:disposable_ci_only@localhost:5432/platform_test
